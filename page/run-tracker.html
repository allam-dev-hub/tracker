<title>Claude Run Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centred column. Header with live state and counts, then run cards newest first, each opening onto its step table. */
:root {
  --bg: #F4F6F8;
  --surface: #FFFFFF;
  --ink: #151922;
  --muted: #5B6474;
  --line: #E1E5EB;
  --accent: #0E7490;
  --done: #15803D;  --done-bg: #E6F4EA;
  --prog: #1D5FD1;  --prog-bg: #E7EEFC;
  --wait: #9A5B06;  --wait-bg: #FBF1DE;
  --fail: #B42318;  --fail-bg: #FCE8E6;
  --skip: #667085;  --skip-bg: #EEF0F3;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1116; --surface: #161A21; --ink: #E7EAF0; --muted: #98A2B3; --line: #272D37; --accent: #2BB3CF;
    --done: #4CC38A; --done-bg: #12291E; --prog: #7AA7FF; --prog-bg: #16233D;
    --wait: #E8B04B; --wait-bg: #2D2412; --fail: #FF7B72; --fail-bg: #351A1B;
    --skip: #9AA3AF; --skip-bg: #20252D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1116; --surface: #161A21; --ink: #E7EAF0; --muted: #98A2B3; --line: #272D37; --accent: #2BB3CF;
  --done: #4CC38A; --done-bg: #12291E; --prog: #7AA7FF; --prog-bg: #16233D;
  --wait: #E8B04B; --wait-bg: #2D2412; --fail: #FF7B72; --fail-bg: #351A1B;
  --skip: #9AA3AF; --skip-bg: #20252D;
  color-scheme: dark;
}

body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 1000px; margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top > div { min-width: 0; }
h1 { margin: 0; font: 700 clamp(22px, 4.2vw, 30px)/1.15 var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.live {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px/1.2 var(--font-body); color: var(--muted);
  padding: 7px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
}
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--skip); flex: none; }
.live[data-state="live"] .dot { background: var(--done); animation: beat 2.4s ease-in-out infinite; }
.live[data-state="slow"] .dot, .live[data-state="cached"] .dot { background: var(--wait); }
.live[data-state="stopped"] .dot, .live[data-state="off"] .dot { background: var(--fail); }
.live time { font-family: var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); }

.counts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13.5px; color: var(--muted); min-height: 1.5em; }
.count { display: inline-flex; align-items: center; gap: 6px; }
.count b { font: 500 13.5px var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); }
.count i { width: 8px; height: 8px; border-radius: 2px; background: var(--skip); }
.count[data-s="in_progress"] i { background: var(--prog); }
.count[data-s="waiting"] i { background: var(--wait); }
.count[data-s="done"] i { background: var(--done); }
.count[data-s="failed"] i { background: var(--fail); }

/* Runs */
#runs { display: grid; gap: 12px; }
.run { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.run > summary {
  list-style: none; cursor: pointer; position: relative;
  padding: 16px 52px 16px 18px; display: grid; gap: 6px; border-radius: 10px;
}
.run > summary::-webkit-details-marker { display: none; }
.run > summary::after {
  content: ""; position: absolute; right: 20px; top: 22px; width: 9px; height: 9px;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
  transform: rotate(45deg); transition: transform .15s ease;
}
.run[open] > summary::after { transform: rotate(-135deg); top: 26px; }
.run > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.run-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.run-title { margin: 0; font: 600 18px/1.3 var(--font-display); text-wrap: balance; overflow-wrap: anywhere; min-width: 0; }
.run-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13.5px; }
.run-meta .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.stale { color: var(--wait); font-weight: 500; }

.strip { display: flex; gap: 3px; margin-top: 6px; max-width: 520px; }
.seg { flex: 1; height: 6px; border-radius: 2px; background: var(--line); }
.seg[data-s="done"] { background: var(--done); }
.seg[data-s="in_progress"] { background: var(--prog); animation: beat 1.6s ease-in-out infinite; }
.seg[data-s="failed"] { background: var(--fail); }
.seg[data-s="skipped"] { background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 6px); }

.pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font: 500 12.5px/1 var(--font-body); padding: 6px 10px; border-radius: 999px;
  background: var(--skip-bg); color: var(--skip);
}
.pill[data-s="done"] { background: var(--done-bg); color: var(--done); }
.pill[data-s="in_progress"] { background: var(--prog-bg); color: var(--prog); }
.pill[data-s="waiting"] { background: var(--wait-bg); color: var(--wait); }
.pill[data-s="failed"] { background: var(--fail-bg); color: var(--fail); }

.note {
  margin: 0; padding: 12px 18px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline;
}
.label { font: 600 11.5px/1.4 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.note .text { overflow-wrap: anywhere; min-width: 0; }
.note .text.none { color: var(--muted); }

/* Steps table */
.table-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
table.steps { width: 100%; border-collapse: collapse; font-size: 14px; }
.steps th {
  text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line);
  font: 600 11.5px/1.4 var(--font-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
}
.steps td { padding: 11px 12px; vertical-align: top; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.steps tbody tr:first-child td { border-top: 0; }
.steps th:first-child, .steps td:first-child { padding-left: 18px; }
.steps th:last-child, .steps td:last-child { padding-right: 18px; }
.steps .n { width: 2.2rem; font-family: var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); }
.steps .name { font-weight: 600; width: 22%; }
.steps .what { width: 34%; }
.steps .st { width: 9.5rem; }
.steps .res { color: var(--muted); }
.steps tr[data-s="in_progress"] td:first-child { box-shadow: inset 3px 0 0 var(--prog); }
.steps tr[data-s="failed"] td:first-child { box-shadow: inset 3px 0 0 var(--fail); }
.steps tr[data-s="failed"] .res { color: var(--fail); }
.steps tr[data-s="skipped"] .name, .steps tr[data-s="skipped"] .what { color: var(--muted); }
.steps .empty { color: var(--muted); padding: 14px 18px; }

/* Empty / info card */
.info { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 22px 20px; }
.info h2 { margin: 0 0 4px; font: 600 17px/1.3 var(--font-display); }
.info p { margin: 0; color: var(--muted); max-width: 62ch; }
.info code { font-family: var(--font-data); font-size: .92em; color: var(--ink); }

.foot { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

@keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .live .dot, .seg { animation: none !important; } .run > summary::after { transition: none; } }

/* Phone: each step becomes a compact stacked row */
@media (max-width: 640px) {
  .run > summary { padding: 14px 44px 14px 14px; }
  .run > summary::after { right: 16px; }
  .note { padding: 12px 14px; }
  .table-wrap { overflow-x: visible; }
  .steps thead { display: none; }
  .steps, .steps tbody { display: block; }
  .steps tr {
    display: grid; grid-template-columns: 1.6rem minmax(0, 1fr) auto;
    grid-template-areas: "n name st" "n what what" "n res res";
    gap: 2px 8px; padding: 12px 14px; border-top: 1px solid var(--line);
  }
  .steps tbody tr:first-child { border-top: 0; }
  .steps td { display: block; padding: 0 !important; border: 0; width: auto !important; }
  .steps .n { grid-area: n; padding-top: 2px !important; }
  .steps .name { grid-area: name; }
  .steps .st { grid-area: st; }
  .steps .what { grid-area: what; }
  .steps .res { grid-area: res; font-size: 13.5px; }
  .steps .res:empty, .steps .what:empty { display: none; }
  .steps tr td:first-child { box-shadow: none !important; }
  .steps tr[data-s="in_progress"] { box-shadow: inset 3px 0 0 var(--prog); }
  .steps tr[data-s="failed"] { box-shadow: inset 3px 0 0 var(--fail); }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Claude Run Tracker</h1>
      <p class="sub">Long jobs Claude is working on, step by step. This page updates by itself.</p>
    </div>
    <div class="live" id="live" data-state="connecting" role="status" aria-live="polite">
      <span class="dot"></span><span id="liveText">Connecting…</span>
    </div>
  </header>
  <div class="counts" id="counts" aria-label="Runs by status"></div>
  <main id="runs">
    <div class="info">
      <h2>Loading runs…</h2>
      <p>Runs appear here as soon as Claude starts one.</p>
    </div>
  </main>
  <p class="foot">Claude fills this page through the <strong>/tracker</strong> skill. Nothing here needs your input.</p>
</div>

<script>
(function () {
  "use strict";

  var STEP = {
    done:        { label: "Done",        icon: "✅" },
    in_progress: { label: "In progress", icon: "🔄" },
    waiting:     { label: "Waiting",     icon: "⏳" },
    failed:      { label: "Failed",      icon: "❌" },
    skipped:     { label: "Skipped",     icon: "" }
  };
  var RUN = {
    in_progress: { label: "In progress", icon: "🔄" },
    waiting:     { label: "Waiting",     icon: "⏳" },
    done:        { label: "Done",        icon: "✅" },
    failed:      { label: "Failed",      icon: "❌" },
    stopped:     { label: "Stopped",     icon: "" }
  };
  var ALIAS = {
    inprogress: "in_progress", running: "in_progress", active: "in_progress", started: "in_progress",
    complete: "done", completed: "done", finished: "done", success: "done",
    error: "failed", fail: "failed",
    pending: "waiting", queued: "waiting", todo: "waiting", paused: "waiting", blocked: "waiting",
    skip: "skipped", cancelled: "stopped", canceled: "stopped", aborted: "stopped"
  };
  var STALE_MS = 3 * 60 * 60 * 1000;

  var runs = [];
  var loaded = false;
  var lastSync = null;
  var liveState = "connecting";
  var openState = new Map();
  var loadTimer = null;
  var retried = false;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function norm(s) {
    if (typeof s !== "string") return "";
    var k = s.trim().toLowerCase().replace(/[\s-]+/g, "_");
    return ALIAS[k.replace(/_/g, "")] || ALIAS[k] || k;
  }
  function isDateOnly(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s.trim()); }
  function parseTime(s) {
    if (typeof s === "number" && isFinite(s)) return s;
    if (typeof s !== "string" || !s.trim()) return null;
    var t = Date.parse(s.trim());
    return isNaN(t) ? null : t;
  }

  var nowYear = new Date().getFullYear();
  function fmtStart(s) {
    var t = parseTime(s);
    if (t === null) return "Start time not given";
    var d = new Date(t);
    if (isDateOnly(s)) {
      return new Intl.DateTimeFormat(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }).format(d);
    }
    var opts = { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" };
    if (d.getFullYear() !== nowYear) opts.year = "numeric";
    return new Intl.DateTimeFormat(undefined, opts).format(d);
  }
  function rel(t) {
    var diff = Date.now() - t;
    if (diff < 0) diff = 0;
    var m = Math.floor(diff / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + " h ago";
    var d = Math.floor(h / 24);
    return d === 1 ? "1 day ago" : d + " days ago";
  }
  function clock(t) {
    return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" }).format(new Date(t));
  }

  function stepsOf(run) {
    var raw = run.steps;
    var list = [];
    if (Array.isArray(raw)) list = raw.slice();
    else if (raw && typeof raw === "object") {
      list = Object.keys(raw).map(function (k) { return Object.assign({ _k: k }, raw[k]); });
      list.sort(function (a, b) { return (Number(a.order) || 0) - (Number(b.order) || 0); });
    }
    return list.filter(function (s) { return s && typeof s === "object"; }).map(function (s, i) {
      return {
        name: s.name || s.step || s.title || ("Step " + (i + 1)),
        what: s.what || s.description || "",
        status: norm(s.status) || "waiting",
        result: s.result || ""
      };
    });
  }
  function runStatus(run, steps) {
    var s = norm(run.status);
    if (s) return s;
    if (steps.some(function (x) { return x.status === "failed"; })) return "failed";
    if (steps.some(function (x) { return x.status === "in_progress"; })) return "in_progress";
    if (steps.length && steps.every(function (x) { return x.status === "done" || x.status === "skipped"; })) return "done";
    return "waiting";
  }

  function pill(status, table) {
    var def = table[status] || { label: status ? status.replace(/_/g, " ") : "Unknown", icon: "" };
    var p = el("span", "pill");
    p.dataset.s = status;
    if (def.icon) p.appendChild(el("span", "", def.icon)).setAttribute("aria-hidden", "true");
    p.appendChild(el("span", "", def.label));
    return p;
  }

  function setLive(state) {
    liveState = state;
    var box = $("live"), txt = $("liveText");
    box.dataset.state = state;
    txt.replaceChildren();
    if (state === "live") {
      txt.append("Live · last change ");
      var tm = el("time", "", clock(lastSync));
      txt.appendChild(tm);
    } else if (state === "cached") {
      txt.textContent = "Showing saved copy · reconnecting…";
    } else if (state === "slow") {
      txt.textContent = loaded ? "Can't reach live data · this may be out of date" : "Can't reach the data yet · it loads when the connection returns";
    } else if (state === "stopped") {
      txt.textContent = "Live updates stopped · reload to reconnect";
    } else if (state === "off") {
      txt.textContent = "Live updates are off · open this page on claude.ai while signed in";
    } else {
      txt.textContent = "Connecting…";
    }
  }

  function renderCounts(items) {
    var c = $("counts");
    c.replaceChildren();
    if (!items.length) return;
    var order = ["in_progress", "waiting", "failed", "done", "stopped"];
    var names = { in_progress: "in progress", waiting: "waiting", failed: "failed", done: "done", stopped: "stopped" };
    var tally = {};
    items.forEach(function (r) { tally[r.status] = (tally[r.status] || 0) + 1; });
    var total = el("span", "count");
    total.appendChild(el("b", "", items.length));
    total.append(items.length === 1 ? " run" : " runs");
    c.appendChild(total);
    order.forEach(function (k) {
      if (!tally[k]) return;
      var s = el("span", "count");
      s.dataset.s = k;
      s.appendChild(el("i"));
      s.appendChild(el("b", "", tally[k]));
      s.append(" " + names[k]);
      c.appendChild(s);
    });
  }

  function infoCard(title, body) {
    var d = el("div", "info");
    d.appendChild(el("h2", "", title));
    var p = el("p");
    if (Array.isArray(body)) body.forEach(function (b) { p.append(b); }); else p.textContent = body;
    d.appendChild(p);
    return d;
  }

  function render() {
    var root = $("runs");
    var items = runs.map(function (r) {
      var steps = stepsOf(r);
      return { id: r.id, raw: r, steps: steps, status: runStatus(r, steps), t: parseTime(r.started) };
    });
    items.sort(function (a, b) {
      if (a.t === null && b.t === null) return a.id < b.id ? 1 : -1;
      if (a.t === null) return 1;
      if (b.t === null) return -1;
      return b.t - a.t || (a.id < b.id ? 1 : -1);
    });
    renderCounts(items);

    if (!items.length) {
      if (liveState === "off") {
        root.replaceChildren(infoCard("Sign in to see your runs", "This page reads live data from your claude.ai account. Open it on claude.ai while signed in."));
      } else if (!loaded) {
        root.replaceChildren(infoCard("Loading runs…", "Runs appear here as soon as Claude starts one."));
      } else {
        var code = el("code", "", "/tracker");
        root.replaceChildren(infoCard("No runs yet", ["Type ", code, " in Claude, or ask for something that takes more than 15 minutes. The run and its steps appear here, newest first."]));
      }
      return;
    }

    var frag = document.createDocumentFragment();
    items.forEach(function (item, idx) {
      var r = item.raw, steps = item.steps;
      var det = el("details", "run");
      det.dataset.status = item.status;
      var defaultOpen = idx === 0 || item.status === "in_progress" || item.status === "waiting" || item.status === "failed";
      det.open = openState.has(item.id) ? openState.get(item.id) : defaultOpen;
      det.addEventListener("toggle", function () { openState.set(item.id, det.open); });

      var sum = el("summary");
      var head = el("div", "run-head");
      head.appendChild(pill(item.status, RUN));
      head.appendChild(el("h2", "run-title", r.title || "Untitled run"));
      sum.appendChild(head);

      var meta = el("div", "run-meta");
      var started = el("span", "", "Started " + fmtStart(r.started));
      meta.appendChild(started);
      if (item.t !== null && !isDateOnly(r.started)) {
        var relS = el("span", "", rel(item.t));
        relS.dataset.rel = String(item.t);
        meta.appendChild(relS);
      }
      var done = steps.filter(function (s) { return s.status === "done"; }).length;
      var failed = steps.filter(function (s) { return s.status === "failed"; }).length;
      var prog = steps.length ? (done + " of " + steps.length + " steps done" + (failed ? " · " + failed + " failed" : "")) : "No steps yet";
      meta.appendChild(el("span", "num", prog));
      var upd = parseTime(r.updated);
      if (item.status === "in_progress" && upd !== null && !isDateOnly(r.updated) && Date.now() - upd > STALE_MS) {
        meta.appendChild(el("span", "stale", "No update for " + rel(upd).replace(" ago", "") + " · the session may have stopped"));
      }
      sum.appendChild(meta);

      if (steps.length) {
        var strip = el("div", "strip");
        strip.setAttribute("aria-hidden", "true");
        steps.forEach(function (s) { var g = el("span", "seg"); g.dataset.s = s.status; strip.appendChild(g); });
        sum.appendChild(strip);
      }
      det.appendChild(sum);

      var note = el("p", "note");
      note.appendChild(el("span", "label", "Interruptions / notes"));
      var nt = typeof r.note === "string" ? r.note.trim() : "";
      note.appendChild(el("span", nt ? "text" : "text none", nt || "None so far"));
      det.appendChild(note);

      var wrap = el("div", "table-wrap");
      var table = el("table", "steps");
      var thead = el("thead"), hr = el("tr");
      [["#", "n"], ["Step", "name"], ["What", "what"], ["Status", "st"], ["Result", "res"]].forEach(function (h) {
        var th = el("th", h[1], h[0]); th.scope = "col"; hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);
      var tb = el("tbody");
      if (!steps.length) {
        var er = el("tr"), ec = el("td", "empty", "Claude has not listed the steps yet.");
        ec.colSpan = 5; er.appendChild(ec); tb.appendChild(er);
      }
      steps.forEach(function (s, i) {
        var tr = el("tr");
        tr.dataset.s = s.status;
        tr.appendChild(el("td", "n", i + 1));
        tr.appendChild(el("td", "name", s.name));
        tr.appendChild(el("td", "what", s.what));
        var st = el("td", "st"); st.appendChild(pill(s.status, STEP)); tr.appendChild(st);
        tr.appendChild(el("td", "res", s.result));
        tb.appendChild(tr);
      });
      table.appendChild(tb);
      wrap.appendChild(table);
      det.appendChild(wrap);
      frag.appendChild(det);
    });
    root.replaceChildren(frag);
  }

  function tick() {
    document.querySelectorAll("[data-rel]").forEach(function (n) { n.textContent = rel(Number(n.dataset.rel)); });
  }

  function armTimer() {
    clearTimeout(loadTimer);
    loadTimer = setTimeout(function () { setLive("slow"); render(); }, 10000);
  }
  function clearTimer() { clearTimeout(loadTimer); loadTimer = null; }

  function subscribe(db) {
    var q;
    try { q = db.collection("runs").orderBy("started", "desc").limit(60); }
    catch (e) { q = db.collection("runs"); }
    armTimer();
    q.onSnapshot(function (snap) {
      runs = snap.docs.filter(function (d) { return d.exists; }).map(function (d) {
        return Object.assign({}, d.data(), { id: d.id });
      });
      loaded = true;
      if (!snap.metadata.fromCache) {
        clearTimer();
        lastSync = Date.now();
        setLive("live");
      } else if (liveState === "connecting") {
        setLive("cached");
      }
      render();
    }, function (err) {
      clearTimer();
      if (err && err.code === "unavailable" && !retried) {
        retried = true;
        setLive("connecting");
        setTimeout(function () { subscribe(db); }, 2000 + Math.random() * 2000);
        return;
      }
      setLive("stopped");
      render();
    });
  }

  async function start() {
    render();
    armTimer();
    var db = null;
    try {
      db = (window.claude && typeof window.claude.use === "function") ? await window.claude.use("db") : null;
    } catch (e) { db = null; }
    if (!db) { clearTimer(); setLive("off"); render(); return; }
    subscribe(db);
  }

  setInterval(tick, 30000);
  setInterval(function () {
    var a = document.activeElement;
    if (!a || !$("runs").contains(a)) render();
  }, 5 * 60 * 1000);

  start();
})();
</script>
